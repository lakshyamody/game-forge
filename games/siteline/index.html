<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Siteline</title>
  <link rel="icon" href="data:," />
  <style>
    html, body { margin: 0; height: 100%; background: #0f1923; overflow: hidden; }
    #game { position: fixed; inset: 0; }
    .hud { font-family: Orbitron, system-ui, sans-serif !important; color: #ece8e1; user-select: none; letter-spacing: 1px; }
    .hud > * { position: absolute; }
    .hud:not(.playing) > :not(.ov) { display: none; }
    #map { top: 14px; left: 14px; width: 216px; border: 2px solid #ece8e133; }
    .top { top: 12px; left: 50%; transform: translateX(-50%); display: flex; align-items: stretch; background: #0f1923cc; }
    .top > span { padding: 8px 16px; font-size: 22px; font-weight: 700; } .top .att { color: #18e5b7; } .top .def { color: #ff4655; }
    .top .mid { padding: 6px 16px; text-align: center; border-left: 1px solid #fff2; border-right: 1px solid #fff2; }
    #timer { font-size: 20px; font-weight: 700; } #timer.red { color: #ff4655; }
    #pips { display: flex; gap: 4px; justify-content: center; margin-top: 4px; } #pips i { width: 10px; height: 4px; background: #ff4655; } #pips i.dead { background: #fff3; }
    #cross { left: 50%; top: 50%; --gap: 6px; }
    #cross i { position: absolute; background: #18e5b7; box-shadow: 0 0 0 1px #0008; }
    #cross i:nth-child(1), #cross i:nth-child(2) { width: 2px; height: 6px; left: -1px; } #cross i:nth-child(1) { top: calc(-6px - var(--gap)); } #cross i:nth-child(2) { top: var(--gap); }
    #cross i:nth-child(3), #cross i:nth-child(4) { height: 2px; width: 6px; top: -1px; } #cross i:nth-child(3) { left: calc(-6px - var(--gap)); } #cross i:nth-child(4) { left: var(--gap); }
    #hitx { left: 50%; top: 50%; width: 22px; height: 22px; transform: translate(-50%, -50%) rotate(45deg); opacity: 0; background: linear-gradient(#fff, #fff) center/2px 100% no-repeat, linear-gradient(#fff, #fff) center/100% 2px no-repeat; -webkit-mask: radial-gradient(circle, transparent 5px, #000 6px); mask: radial-gradient(circle, transparent 5px, #000 6px); }
    #hitx.head { background: linear-gradient(#ff4655, #ff4655) center/3px 100% no-repeat, linear-gradient(#ff4655, #ff4655) center/100% 3px no-repeat; width: 28px; height: 28px; }
    #banner { top: 24%; left: 0; right: 0; text-align: center; font-size: 46px; font-weight: 700; opacity: 0; text-shadow: 0 3px 0 #0008; }
    #banner small { display: block; font-size: 14px; color: #ece8e1; opacity: .85; margin-top: 6px; } #banner em { display: block; font-style: normal; font-size: 18px; color: #ff4655; }
    #banner.show { animation: ban 2.2s ease-out forwards; } @keyframes ban { 0% { opacity: 0; transform: scale(1.3); } 10% { opacity: 1; transform: scale(1); } 75% { opacity: 1; } 100% { opacity: 0; } }
    #hurt { inset: 0; opacity: 0; background: radial-gradient(ellipse at center, transparent 45%, #ff1a2e 130%); pointer-events: none; }
    #plant { left: 50%; top: 60%; transform: translateX(-50%); width: 220px; height: 10px; background: #0009; border: 1px solid #fff5; opacity: 0; } #plantFill { height: 100%; width: 0; background: #ff4655; } #plant span { position: absolute; top: 14px; left: 0; right: 0; text-align: center; font-size: 11px; }
    .hp { bottom: 22px; left: 26px; display: flex; align-items: baseline; gap: 6px; } .hp b { font-size: 40px; } .hp b.low { color: #ff4655; } .hp small { font-size: 12px; opacity: .7; }
    .abil { bottom: 22px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; }
    .abil div { background: #0f1923cc; padding: 6px 12px; font-size: 10px; text-align: center; min-width: 54px; } .abil b { display: block; color: #18e5b7; font-size: 14px; } .abil i { display: block; font-style: normal; color: #ece8e1; margin-top: 2px; }
    .gun { bottom: 22px; right: 26px; text-align: right; } #gname { font-size: 12px; opacity: .8; } .gun b { font-size: 34px; } .gun .cr { font-size: 12px; color: #ffd060; margin-top: 4px; }
    #hint { bottom: 120px; left: 0; right: 0; text-align: center; font-size: 13px; color: #ffd060; text-shadow: 0 2px 0 #000; }
    .hud.scoped::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at center, transparent 0 28vh, #000 28.3vh); pointer-events: none; }
    .hud.scoped::after { content: ''; position: absolute; left: 50%; top: 50%; width: 56vh; height: 56vh; transform: translate(-50%, -50%); background: linear-gradient(#000a, #000a) center/1px 100% no-repeat, linear-gradient(#000a, #000a) center/100% 1px no-repeat; pointer-events: none; }
    .ov { inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; background: linear-gradient(#0f1923cc, #0f192366 50%, #0f1923ee); pointer-events: auto; cursor: pointer; padding: 16px; }
    .ov h1 { margin: 0; font-size: clamp(40px, 9vw, 96px); color: #ece8e1; letter-spacing: 6px; } .ov h1 span { color: #ff4655; }
    .ov p { margin: 0; line-height: 1.9; } .ov .tag { color: #ff4655; font-size: 14px; } .ov .keys { font-size: 12px; background: #0f1923cc; padding: 10px 18px; max-width: 94vw; } .ov .keys em { color: #ffd060; font-style: normal; }
    .ov .dim { opacity: .6; font-size: 11px; } .ov .big { font-size: 48px; font-weight: 700; }
    .ov .go { color: #18e5b7; animation: blink 1.1s steps(2) infinite; } @keyframes blink { 50% { opacity: .35; } }
    #buy { background: #0f1923aa; cursor: default; pointer-events: none; } #buy h2 { margin: 0; font-size: 22px; } #buy h2 span { color: #ff4655; } #buy p { font-size: 12px; opacity: .8; }
    .cards { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .card { width: 150px; padding: 12px; background: #1f2b36ee; border: 2px solid #ece8e133; text-align: left; } .card b { color: #18e5b7; } .card h3 { margin: 6px 0 2px; font-size: 15px; } .card p { color: #ffd060; font-size: 13px; line-height: 1.4; } .card small { font-size: 10px; opacity: .7; }
    .card.own { border-color: #18e5b7; } .card.poor { opacity: .4; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="game"></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
