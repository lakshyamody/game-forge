<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Block Dash</title>
  <link rel="icon" href="data:," />
  <style>
    html, body { margin: 0; height: 100%; background: #0d1116; overflow: hidden; touch-action: none; font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; }
    #game { position: fixed; inset: 0; }
    /* a clean HUD: small translucent chips that read over any scene, never wrap */
    .hud .bar { position: absolute; top: 16px; left: 16px; right: 16px; display: flex; gap: 8px; align-items: center; pointer-events: none; }
    .hud .chip { display: flex; align-items: center; gap: 8px; white-space: nowrap; padding: 7px 14px; border-radius: 12px; background: rgba(12, 16, 22, .55); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,.12); color: #f4f6f8; font-size: 15px; font-weight: 600; letter-spacing: .3px; box-shadow: 0 4px 18px rgba(0,0,0,.25); }
    .hud .chip b { font-weight: 800; font-variant-numeric: tabular-nums; }
    .hud .chip .dim { color: #a9b4c0; font-weight: 500; }
    .hud .spacer { flex: 1; }
    .hud .toast { position: absolute; top: 22%; left: 50%; transform: translateX(-50%); font-size: clamp(28px, 5vw, 54px); font-weight: 800; color: #fff; text-shadow: 0 4px 24px rgba(0,0,0,.45); opacity: 0; transition: opacity .25s; pointer-events: none; }
    .hud .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: linear-gradient(180deg, rgba(8,12,18,.15), rgba(8,12,18,.65)); pointer-events: auto; cursor: pointer; text-align: center; color: #fff; }
    .hud .overlay h1 { margin: 0; font-size: clamp(40px, 8vw, 92px); font-weight: 900; letter-spacing: -1px; text-shadow: 0 6px 30px rgba(0,0,0,.4); }
    .hud .overlay p { margin: 0; color: #dfe6ee; font-size: 16px; }
    .hud .overlay .go { margin-top: 10px; padding: 10px 22px; border-radius: 999px; background: #fff; color: #10151b; font-weight: 700; font-size: 15px; }
    .hud .hidden { display: none; }
    .hud .chip, .hud .overlay h1, .hud .turn, .hud .toast, .hud .pop { font-family: "Press Start 2P", monospace; }
    .hud .chip { font-size: 13px; border-radius: 6px; border: 2px solid rgba(255,255,255,.18); }
    .hud .chip.gold b { color: #ffd84a; }
    .hud .ingot { width: 14px; height: 14px; background: linear-gradient(135deg, #fff6b0 0 25%, #f8d23c 25% 70%, #b8860b 70%); box-shadow: 0 0 0 2px #6b4e00; image-rendering: pixelated; }
    .hud .toast { font-size: clamp(22px, 4vw, 44px); color: #ffe14d; text-shadow: 4px 4px 0 #3a2a00, 0 0 24px rgba(0,0,0,.5); }
    .hud .turn { position: absolute; top: 13%; left: 50%; transform: translateX(-50%); font-size: clamp(18px, 3vw, 30px); color: #fff; text-shadow: 3px 3px 0 #000; opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap; }
    .hud .turn.now { color: #5dff8a; animation: pulse .35s infinite alternate; }
    @keyframes pulse { to { transform: translateX(-50%) scale(1.15); } }
    .hud .danger { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .4s; box-shadow: inset 0 0 140px 30px rgba(170, 20, 20, .55); }
    .hud .flash { position: absolute; inset: 0; pointer-events: none; opacity: .45; animation: fade .26s forwards; }
    @keyframes fade { to { opacity: 0; } }
    .hud .pop { position: absolute; top: 44%; transform: translateX(-50%); font-size: 16px; text-shadow: 2px 2px 0 #000; pointer-events: none; animation: rise .9s ease-out forwards; white-space: nowrap; }
    @keyframes rise { to { transform: translate(-50%, -60px); opacity: 0; } }
    .hud .overlay h1 { color: #fff; text-shadow: 6px 6px 0 #2d6b1f, 10px 10px 0 rgba(0,0,0,.35); letter-spacing: 2px; font-size: clamp(30px, 6.5vw, 72px); }
    .hud .overlay p { font-size: 15px; }
    .hud .overlay .keys kbd { display: inline-block; min-width: 18px; padding: 3px 7px; margin: 0 2px; border-radius: 4px; background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.35); font: 700 13px system-ui, sans-serif; }
    .hud .overlay .go { font-family: "Press Start 2P", monospace; font-size: 13px; border-radius: 6px; background: #5dbb3a; color: #fff; box-shadow: 0 4px 0 #2d6b1f; text-shadow: 2px 2px 0 #2d6b1f; }
    .hud .newbest { color: #ffe14d; font-family: "Press Start 2P", monospace; font-size: 14px; line-height: 2.4; }
  </style>
</head>
<body>
  <div id="game"></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
