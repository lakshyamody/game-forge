<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Silent Assassin</title>
  <link rel="icon" href="data:," />
  <style>
    html, body { margin: 0; height: 100%; background: #3a3050; overflow: hidden; touch-action: none; }
    #game { position: fixed; inset: 0; }
    .hud { font-family: Orbitron, system-ui, sans-serif !important; color: #fff; text-shadow: 0 2px 0 #000a; user-select: none; }
    .hud > * { position: absolute; }
    .bar { background: #120e1ccc; border: 2px solid #ffffff22; border-radius: 10px; padding: 8px 14px; font-size: 14px; letter-spacing: 1px; }
    .top-l { top: 12px; left: 12px; display: flex; flex-direction: column; gap: 4px; }
    .top-c { top: 12px; left: 50%; transform: translateX(-50%); font-size: 16px; letter-spacing: 3px; transition: color .2s, border-color .2s; }
    .top-c.green { color: #6dffa0; border-color: #6dffa055; } .top-c.yellow { color: #ffc23f; border-color: #ffc23f; } .top-c.red { color: #ff4040; border-color: #ff4040; animation: pulse .5s infinite alternate; }
    @keyframes pulse { to { box-shadow: 0 0 22px #ff404099; } }
    .top-r { top: 12px; right: 12px; display: flex; gap: 16px; align-items: center; } #hearts { color: #ff4060; font-size: 20px; letter-spacing: 2px; }
    .prompt { display: none; transform: translate(-50%, -100%); background: #000c; border: 2px solid #fff; border-radius: 8px; padding: 5px 10px; font-size: 13px; white-space: nowrap; }
    .prompt.target { border-color: #ff4050; color: #ff8090; } .prompt.civ { border-color: #888; color: #aaa; }
    #pops { inset: 0; pointer-events: none; } .pop { position: absolute; transform: translate(-50%, -50%); font-size: 16px; font-weight: 700; animation: pop 1.2s ease-out forwards; } .pop.big { font-size: 26px; }
    @keyframes pop { 0% { transform: translate(-50%, -50%) scale(1.6); } 15% { transform: translate(-50%, -50%) scale(1); } to { transform: translate(-50%, -280%); opacity: 0; } }
    #hurt { inset: 0; pointer-events: none; opacity: 0; box-shadow: inset 0 0 160px 40px #ff0020; } #hurt.flash { animation: hurt .45s ease-out; } @keyframes hurt { from { opacity: 1; } to { opacity: 0; } }
    #banner { top: 24%; left: 0; right: 0; text-align: center; font-size: clamp(22px, 4vw, 40px); opacity: 0; letter-spacing: 3px; text-shadow: 0 4px 0 #000a; }
    #banner.show { animation: ban 2.2s ease-out forwards; } @keyframes ban { 0% { opacity: 0; transform: scale(1.5); } 12% { opacity: 1; transform: scale(1); } 75% { opacity: 1; } 100% { opacity: 0; } }
    .ov { inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; background: radial-gradient(#0d0a16aa, #0d0a16ee); pointer-events: auto; cursor: pointer; padding: 16px; }
    .ov h1 { margin: 0; font-size: clamp(36px, 8vw, 84px); color: #e8e4f0; letter-spacing: 4px; } .ov h1 span { color: #ff3040; text-shadow: 0 0 24px #ff3040aa; }
    .ov p { margin: 0; line-height: 1.9; } .ov .tag { color: #c9bfe0; font-size: 14px; } .ov .keys { font-size: 12px; background: #000a; padding: 12px 18px; border-radius: 10px; max-width: 94vw; }
    .ov .go { color: #6dffa0; font-size: 14px; animation: blink 1.1s steps(2) infinite; } @keyframes blink { 50% { opacity: .35; } }
    .hud .hidden { display: none; }
  </style>
</head>
<body>
  <div id="game"></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
