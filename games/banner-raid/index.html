<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Banner Raid</title>
  <link rel="icon" href="data:," />
  <style>
    html, body { margin: 0; height: 100%; background: #9fd4ff; overflow: hidden; }
    #game { position: fixed; inset: 0; }
    .hud { font-family: "Press Start 2P", monospace !important; color: #fff; text-shadow: 2px 2px 0 #0009; user-select: none; }
    .hud > * { position: absolute; }
    .hud:not(.playing) > :not(.ov):not(#pops) { display: none; }
    .bar { background: #2b1d12cc; border: 3px solid #f2c14e; border-radius: 10px; padding: 8px 14px; }
    .top-l { top: 12px; left: 12px; display: flex; flex-direction: column; gap: 6px; font-size: 11px; } .top-l small { color: #ffd34d; font-size: 9px; }
    .top-c { top: 12px; left: 50%; transform: translateX(-50%); font-size: 18px; }
    .top-r { top: 12px; right: 12px; display: flex; gap: 12px; align-items: center; font-size: 14px; } #stars { color: #ffd34d; font-size: 18px; letter-spacing: 2px; }
    #cards { bottom: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; }
    .card { width: 104px; padding: 10px 8px; background: #3b2a1c; border: 3px solid var(--c); border-radius: 10px; display: flex; flex-direction: column; gap: 6px; font-size: 9px; cursor: pointer; pointer-events: auto; transition: transform .1s; }
    .card b { color: var(--c); } .card em { font-style: normal; font-size: 14px; } .card.sel { transform: translateY(-8px); box-shadow: 0 0 0 3px #fff; } .card.empty { opacity: .35; }
    #endBtn { bottom: 18px; left: 16px; pointer-events: auto; }
    button { font: inherit; font-size: 10px; color: #fff; background: #d8452f; border: 3px solid #fff3; border-radius: 8px; padding: 10px 12px; cursor: pointer; text-shadow: 1px 1px 0 #0008; box-shadow: 0 4px 0 #7a2216; }
    button:disabled { background: #6b5a4a; box-shadow: 0 4px 0 #3b2a1c; cursor: default; opacity: .7; } button.big { font-size: 13px; background: #3f9d2f; box-shadow: 0 4px 0 #22581a; padding: 14px 20px; }
    #banner { top: 22%; left: 0; right: 0; text-align: center; font-size: 34px; color: #ffd34d; opacity: 0; text-shadow: 4px 4px 0 #000a; }
    #banner.show { animation: ban 2s ease-out forwards; } @keyframes ban { 0% { opacity: 0; transform: scale(1.5); } 12% { opacity: 1; transform: scale(1); } 75% { opacity: 1; } 100% { opacity: 0; } }
    #msg { top: 34%; left: 0; right: 0; text-align: center; font-size: 12px; color: #ff8a7a; transition: opacity .4s; opacity: 0; }
    #pops, #hpbars { inset: 0; pointer-events: none; } .pop { position: absolute; transform: translate(-50%, -50%); font-size: 13px; animation: pop 1.1s ease-out forwards; } @keyframes pop { to { transform: translate(-50%, -260%); opacity: 0; } }
    .hp { position: absolute; width: 46px; height: 6px; transform: translate(-50%, -50%); background: #0009; border: 1px solid #000; } .hp i { display: block; height: 100%; background: #6be04a; }
    .ov { inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; background: linear-gradient(#1b120acc, #1b120a55 50%, #1b120add); pointer-events: auto; padding: 16px; }
    #menu { cursor: pointer; }
    .ov h1 { margin: 0; font-size: clamp(32px, 7vw, 72px); color: #ffd34d; text-shadow: 5px 5px 0 #7a2216; } .ov h1 span { color: #ff5a3c; text-shadow: 5px 5px 0 #4a120a; }
    .ov h2 { margin: 0; font-size: 22px; color: #ffd34d; } .ov p { margin: 0; line-height: 1.9; }
    .ov .tag { font-size: 12px; color: #ffe9b0; } .ov .keys { font-size: 10px; background: #000a; padding: 10px 16px; border-radius: 8px; max-width: 94vw; }
    .ov .go { color: #8dff6b; font-size: 13px; animation: blink 1.1s steps(2) infinite; } @keyframes blink { 50% { opacity: .35; } }
    .gold { font-size: 18px; color: #ffd34d; }
    #campCards { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .tcard { width: 190px; background: #3b2a1cee; border: 3px solid var(--c); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .tcard h3 { margin: 0; font-size: 12px; color: var(--c); } .tcard h3 small { color: #fff; font-size: 9px; } .tcard p { font-size: 8px; line-height: 1.6; opacity: .85; }
    .row { display: flex; gap: 10px; align-items: center; justify-content: center; } .row b { min-width: 34px; font-size: 16px; }
    #capLine { font-size: 11px; }
    .starsBig i { font-style: normal; font-size: 64px; color: #4a3a2a; display: inline-block; } .starsBig i.on { color: #ffd34d; animation: star .5s backwards; } @keyframes star { from { transform: scale(3) rotate(-30deg); opacity: 0; } }
    #resInfo { font-size: 12px; line-height: 2; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="game"></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
