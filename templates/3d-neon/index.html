    html, body { margin: 0; height: 100%; background: #05060f; overflow: hidden; touch-action: none; font-family: Orbitron, system-ui, sans-serif; }
    #game { position: fixed; inset: 0; }
    .hud .stat { position: absolute; top: 18px; font-size: 22px; letter-spacing: 2px; text-shadow: 0 0 12px currentColor; }
    .hud .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: rgba(5,6,15,.55); pointer-events: auto; cursor: pointer; text-align: center; }
    .hud .overlay h1 { margin: 0; font-size: clamp(36px, 8vw, 88px); color: #ff4dd2; text-shadow: 0 0 24px #ff4dd2; }
    .hud .overlay p { margin: 0; color: #b9c2ff; font-size: 14px; letter-spacing: 1px; }
    .hud .hidden { display: none; }
  </style>
