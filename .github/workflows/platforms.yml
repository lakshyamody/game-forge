# Game Forge on macOS and Windows: type-check, staged fixes (Windows checks out CRLF; patches are LF), headless
# playtest, itch.io export, then build Game Forge Studio for that OS and smoke-test the packaged app.
name: platforms

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run check
      - name: Staged fixes (save / apply / undo, real fixes)
        run: node scripts/test/fixes-roundtrip.mjs blast-ball siteline banner-raid sunset-district
      - name: Headless playtest
        run: npm run shot -- neon-swarm --seconds 4
      - name: itch.io export
        run: npm run ship -- neon-swarm
      - name: Build Studio UI
        run: |
          npm ci --prefix studio/ui
          npm run build --prefix studio/ui
      - name: Studio from the repo
        run: node scripts/test/studio-smoke.mjs --shot studio-dev.png
      - name: Studio end-to-end (UI, without Claude Code)
        run: node scripts/test/studio-e2e.mjs --shots e2e-shots
      - name: Build Studio
        run: npm run studio:build
      - name: Studio packaged
        run: node scripts/test/studio-smoke.mjs --packaged --shot studio-packaged.png
      # Last on Windows, because it takes the runner's tools away: a PC with no Node, Git or Python, no Claude Code and
      # no workspace yet. The app must install Claude Code itself and run everything on its own Node + Chromium;
      # the test itself runs on the app's Node too.
      - name: Studio packaged on a blank Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($d in 'C:\Program Files\Git', 'C:\Program Files\nodejs', "$env:LOCALAPPDATA\Programs\nodejs") { if (Test-Path $d) { Rename-Item $d "$d.off" } }
          Remove-Item -Recurse -Force "$HOME\Game Forge", "$HOME\.local\bin\claude.exe", "$HOME\.claude", "$HOME\.claude.json", "$env:APPDATA\Game Forge Studio" -ErrorAction SilentlyContinue
          $env:Path = 'C:\Windows\system32;C:\Windows;C:\Windows\System32\Wbem;C:\Windows\System32\WindowsPowerShell\v1.0'
          if (Get-Command node, git, python -ErrorAction SilentlyContinue) { throw 'the runner still has node/git/python on PATH' }
          $env:ELECTRON_RUN_AS_NODE = '1'
          # piped: PowerShell doesn't wait for a GUI-subsystem exe (Electron) unless its output is consumed
          & "$PWD\dist-studio\win\Game Forge Studio\Game Forge Studio.exe" scripts/test/studio-smoke.mjs --packaged --require-claude --shot studio-blank.png 2>&1 | Out-Host
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-${{ matrix.os }}
          path: |
            studio-*.png
            e2e-shots/*.png
            .shots/neon-swarm/*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: success() && runner.os == 'Windows'
        with:
          name: Game-Forge-Studio-win-x64
          path: dist-studio/Game-Forge-Studio-win-x64.zip
